server:
  port: 8081
spring:
  application:
    name: cdeh-msa-dm-account
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/bdd_account
    username: postgres
    password: postgres
    pool:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/bdd_account
    user: postgres
    password: postgres
    validate-on-migrate: true

